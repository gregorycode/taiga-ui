<p>{{ index() }}</p>
<tui-infinite-scroll [(index)]="index">
    <ng-template let-index>
        <div
            class="item"
            [style.background]="index.toString() | tuiAutoColor"
        >
            {{ index }}
        </div>
    </ng-template>
</tui-infinite-scroll>
